trigger: none

pool: vishal-kumar

steps:
- task: TerraformInstaller@1
  inputs:
    terraformVersion: 'latest'
- task: TerraformTask@5
  inputs:
    provider: 'azurerm'
    command: 'init'
    workingDirectory: '$(System.DefaultWorkingDirectory)/azure_infra'
    backendServiceArm: 'connection'
    backendAzureRmResourceGroupName: 'test1'
    backendAzureRmStorageAccountName: 'badastore'
    backendAzureRmContainerName: 'container'